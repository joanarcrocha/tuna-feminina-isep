# Publica o site no GitHub Pages sempre que há alterações no ramo main.
# Precisa das variáveis do repositório (Settings > Secrets and variables > Actions > Variables):
#   SUPABASE_URL, SUPABASE_ANON_KEY, EDITOR_EMAIL, WEB3FORMS_KEY (formulário de contacto)
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Confirmar configuração do Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Falta a variável SUPABASE_URL do repositório. Veja o ficheiro DEMO.md."
            exit 1
          fi
      - run: npm ci -w frontend
      - run: npm run build -w frontend
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_EDITOR_EMAIL: ${{ vars.EDITOR_EMAIL }}
          VITE_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
