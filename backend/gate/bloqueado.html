<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Em construção · TUFEISEP</title>
  <link rel="icon" type="image/png" href="/bloqueado/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/bloqueado/bloqueado.css">
</head>
<body>
  <main class="cena">
    <div class="imagem" role="img" aria-label="Fachada de tijolo com janelas em grelha e linhas de projeto"></div>
    <section class="cartao">
      <img class="logo" src="/bloqueado/logo.webp" alt="Tuna Feminina do ISEP" width="120" height="120">
      <p class="etiqueta">Tuna Feminina do ISEP</p>
      <h1>Em <em>construção</em></h1>
      <p class="texto">Estamos a preparar o novo site da TUFEISEP. Volta em breve.</p>
      <form id="form" autocomplete="off">
        <label for="pw">Já tens acesso?</label>
        <div class="campo">
          <input id="pw" name="palavraPasse" type="password" placeholder="Palavra-passe" required autocomplete="current-password">
          <button type="submit">Entrar</button>
        </div>
        <p id="erro" class="erro" role="alert" hidden></p>
      </form>
    </section>
  </main>
  <script src="/bloqueado/bloqueado.js"></script>
</body>
</html>
